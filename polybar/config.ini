[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #8a8a8a
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
font-0 = JetBrains Mono NF ExtraBold:size=10;0
font-1 = "Font Awesome 6 Free Solid:size=10;1"
font-3 = "Noto Emoji:size=10;3"
width = 100%
height = 24pt
radius = 0
bottom = true
monitor = ${env:MONITOR:}
background = #B3000000
foreground = ${colors.foreground}
line-size = 3pt
border-size = 0pt
border-color = #00000000
padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

modules-left = i3 
modules-center = weather 
modules-right = ratiogoblin filesystem pulseaudio xkeyboard memory cpu battery wlan date 
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M

format-charging-foreground = ${colors.primary}
; format-discharging = <ramp-capacity>  <label-discharging>
format-discharging = %{F#8a8a8a}<ramp-capacity>%{F-}  <label-discharging>
format-full = <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 

label-low = BATTERY LOW

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
; Framerate in milliseconds
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = false
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true
format = <label-state> <label-mode>

label-focused = %index%
label-focused-foreground = #ffffff
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = #000000
label-urgent-background = #bd2c40
label-urgent-padding = 4

label-separator = |
label-separator-padding = 0
label-separator-foreground = ${colors.disabled}

[module/weather]
type = custom/script
exec = $HOME/scripts/weather
tail = false
interval = 960

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
; label-mounted =   %percentage_used%%
; label-mounted = %mountpoint% %percentage_used%%
; label-mounted = %{F${colors.icon}}%{F-} %percentage_used%%

label-mounted = %{F#8a8a8a}%{F-}  %percentage_used%%
label-mounted-foreground = ${colors.primary}
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
# label = %percentage_used:2%%
label = %used:0.1f%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " " 
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %essid%

[module/date]
type = internal/date
interval = 1
date = %A %d/%m %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/ratiogoblin]
type = custom/script
exec = ratiogoblin run
interval = 3600
label = "  %output%"
